{% extends "base.html" %}
{% block title %}运行日志 - Ani2Openlist{% endblock %}

{% block content %}<div class="page-heading">
<div>
<p class="eyebrow">ACTIVITY</p>
<h1>运行日志</h1>
<p class="subtitle">查看同步过程，快速定位运行问题。</p>
</div>
<div class="actions">
<button class="btn" onclick="refreshLogs()">{{ icon('refresh') }}刷新</button>
<button id="clear-btn" class="btn btn-danger" onclick="clearLogs()">{{ icon('trash') }}清空日志</button>
</div>
</div>
<div id="alert-container" aria-live="polite">
</div>
<section class="card">
<div class="log-toolbar">
<div class="search-field">
<label for="log-search">搜索消息</label>
<input type="search" id="log-search" placeholder="输入关键词…">
</div>
<div>
<label for="log-level">日志级别</label>
<select id="log-level">
<option value="all">全部级别</option>
<option value="success">成功</option>
<option value="info">信息</option>
<option value="warning">警告</option>
<option value="error">错误</option>
</select>
</div>
<label class="check-label">
<input type="checkbox" id="auto-refresh" checked>自动刷新 · 5 秒</label>
</div>
<div class="section-heading log-meta">
<p id="log-count" class="muted">仅显示服务端最近 100 条记录</p>
<p id="refresh-state" class="refresh-state" role="status">正在获取日志…</p>
</div>
<div id="logs-container" class="log-list">
<p class="empty">正在加载日志…</p>
</div>
</section>{% endblock %}

{% block scripts %}<script src="{{ url_for('static', filename='js/logs.js') }}">
</script>{% endblock %}
